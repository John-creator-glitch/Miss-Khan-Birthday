  C.chapters.forEach((c,i)=>{const b=$('button','ch',T(c.title));tl.appendChild(b);b.onclick=()=>{b.classList.add('seen');card.innerHTML=`${c.photo?`<img src="${c.photo}" alt="">`:''}<p class="ln sm on" style="opacity:1">${T(c.date)}</p><p class="ln ttl on" style="margin:0;font-size:1.9rem">${T(c.title)}</p><p class="ln sub on">${T(c.memory)}</p><p class="ln on" style="font-size:1.4rem;color:var(--rose);font-style:italic">${T(c.message)}</p>`;const cb=$('button','b on','Back');cb.style.marginTop='.6rem';cb.onclick=()=>card.classList.remove('on');card.appendChild(cb);card.classList.add('on')}});
  const go=btn(s,'Continue');await sleep(1500);await click(go)});
},
async()=>{
 /* secret button */
 await scene('',async s=>{fx.mode='stars';bk(.15);await line(s,'Okay... there’s something else.',{ms:2200});const b=btn(s,'Don’t click this.','glow');await click(b);
  Mu.chime();fx.mode='gather';dim.style.opacity=.55;s.style.transition='opacity 1.5s';await sleep(2000);fx.mode='stars';
  await line(s,'I tried to find the perfect birthday gift...',{ms:2600});await line(s,'But honestly...',{ms:1700});await line(s,'I couldn’t put friendship in a box.',{ms:3000});await line(s,'So I made you this instead.',{ms:2400});dim.style.opacity=0});
 await chap('CHAPTER III','A Voice Note');
 await scene('',async s=>{fx.mode='rise';fx.tv=.8;Mu.set(.3);bk(.4);await lines(s,C.thanks,{ms:2400})});
 /* voice note (the letter itself stays on her page) */
 Mu.set(.22);bk(.3);fx.mode='gold';fx.tv=.45;
 await scene('',async s=>{await line(s,'One more thing.',{ms:1800});await line(s,'I recorded this for you.',{ms:2200});
  const vb=btn(s,'▶  Play voice note','glow');await click(vb);vb.remove();
  const au=VOICE.el=VOICE.pre||new Audio(C.voice);au.preload='auto';au.muted=false;
  const wv=$('div','wave','<i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>');s.appendChild(wv);
  const lab=$('p','ln sm on','VOICE NOTE FROM NADAB');lab.style.cssText='opacity:.9;margin-top:1.4rem';s.appendChild(lab);
  const cap=$('p','ln sub');cap.style.minHeight='4.6em';s.appendChild(cap);
  Mu.duck(true);(C.voiceCaptions||[]).forEach(([t,tx])=>pt(()=>{cap.textContent=tx;cap.classList.add('on')},t/SP));
  let tries=0;
  while(true){
   const r=await new Promise(res=>{au.onended=()=>res('end');au.onerror=()=>res('err');au.play().catch(()=>res('blocked'))});
   if(r==='end')break;
   tries++;Mu.duck(false);wv.classList.add('done');const bad=au.error||au.networkState===3;
   lab.textContent=bad?'VOICE NOTE COULD NOT LOAD':'TAP TO PLAY';lab.style.opacity=1;
   const rb=btn(s,tries>=2?'Continue':'↻  Try again','glow');await click(rb);rb.remove();
   if(tries>=2)break;
   if(bad){au.src=C.voice+(C.voice.includes('?')?'&':'?')+'r='+Date.now();au.load()}
   wv.classList.remove('done');lab.textContent='VOICE NOTE FROM NADAB';Mu.duck(true)}
  VOICE.el=null;Mu.duck(false);wv.classList.add('done');cap.classList.remove('on');await sleep(1000);
  await line(s,'Happy Birthday, Miss Khan.',{c:'ttl',ms:2600})});
},
async()=>{
 /* cake */
 Mu.set(.3);
 await chap('CHAPTER IV','The Wish');
 await scene('low',async s=>{bk(0);fx.mode='stars';fx.tv=.3;const w=tagged(s,C.dream&&C.dream.tag);const v=getv(C.cakeVideo);v.loop=true;try{v.currentTime=0}catch(e){}w.prepend(v);v.play().catch(()=>{});await sleep(80);v.classList.add('on');
  await line(s,'Okay, birthday girl...',{ms:2000});await line(s,'Make a wish.',{keep:1,c:'ttl',ms:1400});
  const bb=btn(s,'Blow the candles','glow');await click(bb);bb.remove();
  Mu.chime();v.style.transition='filter 2.8s';v.style.filter='brightness(.22) blur(3px)';dim.style.opacity=.35;fx.mode='rise';fx.tv=1;Mu.set(.5);await sleep(2000);s.querySelector('.ttl').classList.remove('on');
  await line(s,'I hope it comes true.',{ms:2600});await line(s,'Then we’ll just make another wish next year.',{ms:3200});dim.style.opacity=0;v.pause()});
},
async()=>{
 /* celebration */
 fx.mode='gold';fx.tv=1;Mu.set(.8);bk(.8);await chap('CHAPTER V','The Celebration');
 await scene('',async s=>{const b=$('div','rbg');b.style.backgroundImage=`url(${C.hero})`;s.append(b,$('div','rays'));await sleep(60);b.classList.add('on');await sleep(800);await line(s,'HAPPY BIRTHDAY',{c:'ttl',keep:1,ms:2200});await line(s,C.name,{c:'big',keep:1,ms:2600});await line(s,C.celebrationSub,{c:'sub',keep:1,ms:3200})});
 /* distance, closing in */
 fx.mode='stars';fx.tv=.7;Mu.set(.3);pts({on:1,gap:.95,tg:.95,link:1,tl:1});bk(.3);
 await scene('',async s=>{const p=s.appendChild($('div'));p.style.cssText='position:absolute;top:22%;left:0;right:0;display:flex;flex-direction:column;align-items:center;padding:0 1.4rem';
  await sleep(800);pts({tg:.6});await line(s,'Maybe we’re miles apart.',{into:p,ms:2400});pts({tg:.3});await line(s,'But you’re never forgotten.',{into:p,ms:2600});pts({tg:.15});await line(s,'Never.',{into:p,c:'big',ms:2200})});
 pts({on:0});Mu.set(.32);
 await scene('',async s=>{bk(.3);fx.mode='stars';for(const t of C.final.lines)await line(s,t,{ms:t.length<18?2000:2800});
  await line(s,C.final.title,{c:'big',keep:1,ms:3200});await line(s,C.final.sub,{c:'sub',keep:1,ms:5000});fx.tv=.15;
  s.style.transition='opacity 2s';s.classList.remove('in');await sleep(2000);s.innerHTML='';s.classList.add('in');
  for(const [r,n] of C.credits){const d=$('div','ln',`<small style="font:400 .7rem Inter,sans-serif;letter-spacing:.35em;color:var(--rose);display:block;margin-bottom:.3rem">${T(r)}</small>${T(n)}`);d.style.fontSize='clamp(1.6rem,5vw,2.4rem)';s.appendChild(d);await sleep(40);d.classList.add('on');await wait(1900);d.classList.remove('on');await sleep(900);d.remove()}
  await lines(s,C.ending,{ms:3000,keep:0});});
}];
let CUR=0;
async function film(i=0){
 fx.mode='stars';fx.pts=null;dim.style.opacity=0;
 if(i==0){fx.tv=.02;bk(0);document.body.classList.remove('bright');Mu.set(.18)}else{document.body.classList.add('bright');fx.tv=.5;bk(.3);Mu.set(.3)}
 for(let k=i;k<SEG.length;k++){CUR=k;await SEG[k]()}
 CUR=SEG.length;await showPage();stage.innerHTML='';film(0)}
/* ---------- pause + chapters ---------- */
const pz=document.getElementById('pz');
const NAMES=['I · Distance','II · Memories','III · Voice','IV · Wish','V · Celebration','Her page'];
const showMenu=on=>{pz.classList.toggle('on',on);if(on){[...pz.querySelectorAll('.pzm button')].forEach((b,i)=>b.classList.toggle('cur',i==CUR));document.getElementById('pzt').textContent='PAUSED  ·  '+(NAMES[CUR]||'').toUpperCase()+'  ·  TAP TO CONTINUE'}};
function pauseUI(){if(PZ)return;PZ=true;TM.forEach(o=>{clearTimeout(o.id);o.rem=Math.max(0,o.rem-(performance.now()-o.t0))});document.body.classList.add('pz');
 Object.values(PV).forEach(v=>{if(v.isConnected&&!v.paused){v.dataset.pp=1;v.pause()}});if(VOICE.el&&!VOICE.el.paused){VOICE.el.dataset.pp=1;VOICE.el.pause()}
 stage.querySelectorAll('.bar i b').forEach(b=>{const w=b.getBoundingClientRect().width;b.style.transition='none';b.style.width=w+'px'});showMenu(true)}
function resumeUI(){if(!PZ)return;PZ=false;document.body.classList.remove('pz');
 Object.values(PV).forEach(v=>{if(v.dataset.pp){delete v.dataset.pp;v.play().catch(()=>{})}});if(VOICE.el&&VOICE.el.dataset.pp){delete VOICE.el.dataset.pp;VOICE.el.play().catch(()=>{})}
 stage.querySelectorAll('.bar i b').forEach(b=>{const tot=b.parentElement.getBoundingClientRect().width,w=b.getBoundingClientRect().width;if(w>0&&w<tot-1){void b.offsetWidth;b.style.transition='width '+(4.1*(1-w/tot)/SP)+'s linear';b.style.width='100%'}});
 TM.forEach(o=>o.start());showMenu(false)}
function jumpTo(i){if(VOICE.el){VOICE.el.pause();VOICE.el=null}Mu.duck(false);TM.forEach(o=>clearTimeout(o.id));TM.clear();skip=null;PZ=false;document.body.classList.remove('pz');showMenu(false);stage.innerHTML='';
 Object.values(PV).forEach(v=>{v.pause();delete v.dataset.pp;v.classList.remove('on');v.style.filter='';v.style.transition='';v.remove()});
 dim.style.opacity=0;fx.pts=null;fx.mode='stars';document.getElementById('page').classList.remove('on');document.body.classList.remove('pg');setTimeout(()=>film(i),400)}
pz.querySelectorAll('.pzm button').forEach((b,i)=>b.onclick=()=>jumpTo(i));document.getElementById('pzr').onclick=resumeUI;
addEventListener('pointerdown',e=>{if(!started||document.body.classList.contains('pg'))return;if(e.target.closest('button,#lbx'))return;PZ?resumeUI():pauseUI()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&started&&!document.body.classList.contains('pg'))pauseUI()});
/* ---------- start (splash with background video) ---------- */
(async()=>{
 const s=$('div','scene in');stage.appendChild(s);fx.tv=.15;s.classList.add('spl-s');
 const sbg=$('div','splbg');sbg.style.backgroundImage=`url(${C.hero})`;
 /* background video: config.js -> startVideo:'video/start.mp4' (falls back to the hero photo if missing) */
 let sv=null;
 if(C.startVideo){
  sv=$('video','sv');sv.src=C.startVideo;sv.poster=C.hero;
  sv.muted=true;sv.defaultMuted=true;sv.loop=true;sv.autoplay=true;sv.playsInline=true;
  sv.setAttribute('muted','');sv.setAttribute('playsinline','');sv.setAttribute('webkit-playsinline','');sv.preload='auto';
  sv.onerror=()=>{sv.remove();sv=null};
  sbg.appendChild(sv);
 }
 s.prepend(sbg);fx.tv=.55;
 const p=$('div','splin',`<small>A BIRTHDAY FILM</small><h1>${T(C.name)}</h1><span class="spd">${dateStr}</span><em>${T(C.sender)}</em>`);s.appendChild(p);
 if(sv)sv.play().catch(()=>{});
 await sleep(120);sbg.classList.add('on');await sleep(2200);
 const b=btn(s,'Tap to begin');await sleep(900);b.classList.add('on');
 const hint=$('p','ln sm','Turn sound on');hint.style.cssText='margin-top:1.4rem;letter-spacing:.25em;opacity:.7';s.appendChild(hint);await sleep(300);hint.classList.add('on');
 b.onclick=async()=>{b.onclick=null;started=true;
  try{Mu.start()}catch(e){}
  try{if(C.voice){const pa=VOICE.pre=new Audio(C.voice);pa.preload='auto';pa.muted=true;pa.play().then(()=>{pa.pause();pa.currentTime=0;pa.muted=false}).catch(()=>{pa.muted=false})}}catch(e){}
  preload();sb.classList.add('on');document.body.classList.add('cine');s.classList.remove('in');
  await sleep(1400);
  if(sv){try{sv.pause()}catch(e){}}
  s.remove();
  const sk=document.getElementById('skp');sk.onclick=pauseUI;setTimeout(()=>sk.classList.add('on'),20000/SP);
  film(location.hash=='#page'?SEG.length:0)}
})();
</script></body></html>
